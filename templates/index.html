<!DOCTYPE html>

<html>

    <head>
        <title>Calculadora - Equação Segundo Grau</title>
        <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    </head>

    <body>
        <h2>Calculadora de Equações do Segundo Grau</h2>
        <h4>Insira os valores de <b>a</b>, <b>b</b> e <b>c</b>, o sistema irá retornar o resultado da equação.</h4>
        <main class="container">
        <form action="/enviar" method="post">
            <input type="number" name="a" placeholder="Insira o valor de A">
            <input type="number" name="b" placeholder="Insira o valor de B">
            <input type="number" name="c" placeholder="Insira o valor de C">
            <button type="submit" name="enviar">Converter</button>
        </form>
        {% if erro %}
            <h7 style="color: red">{{erro}}</h7>
        {% endif %}
        {% if x1 and x2 %}
            <h7>X1: {{x1}} <br>X2: {{x2}}</br></h7>
        {% endif %}
        </main>
    </body>

</html>
